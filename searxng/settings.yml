use_default_settings: true

server:
  secret_key: "your-secret-key-change-this-to-anything"
  bind_address: "0.0.0.0"

search:
  formats:
    - html
    - json

engines:
  - name: google
    engine: google
    disabled: false
  - name: bing
    engine: bing
    disabled: false
  - name: duckduckgo
    engine: duckduckgo
    disabled: false
